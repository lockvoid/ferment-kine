[package]
name = "kine"
version = "0.1.0"
edition = "2021"
authors = ["LockVoid Labs ~●~"]
license = "MIT OR Apache-2.0"
# Not published to crates.io while pre-1.0; consumers vendor or pin a git rev.
publish = false
description = "A Rust render core for motion documents, over the Vello CPU renderer."
repository = "https://github.com/lockvoid/ferment-kine"

[lib]
name = "kine"
# cdylib: loaded by FFI language bindings. staticlib: linked into native apps.
# One extern-C surface (include/kine.h) serves both.
crate-type = ["cdylib", "staticlib", "rlib"]

[profile.release]
# Required for catch_unwind at the FFI boundary — a panic must be caught and
# turned into an error sentinel, never abort the host process. Do NOT set abort.
panic = "unwind"

[features]
default = []
# The GPU raster flavor (vello_gpu over wgpu/Metal). OFF by default: the ruby
# gem and the rails server build the CPU flavor and must never pull the wgpu
# tree. `scripts/build-xcframework.sh` builds WITH it; `ext/kine/extconf.rb`
# builds WITHOUT it, unchanged.
gpu = ["dep:vello_gpu", "dep:wgpu", "wgpu/metal", "dep:pollster", "dep:objc2", "dep:objc2-metal"]
# The same flavor over wgpu's GLES backend, on the HOST's current EGL context —
# Android's twin of `gpu`. `kotlin/build.sh android` builds WITH it.
gpu-gles = ["dep:vello_gpu", "dep:wgpu", "wgpu/gles", "dep:pollster"]

[dependencies]
vello_cpu = { version = "=0.3.0", features = ["text", "png", "multithreading"] }
# Same 0.3.0 workspace release as vello_cpu — one vello_common in the lock, so
# scene/strip geometry is shared and only the RASTER back-end differs.
vello_gpu = { version = "=0.3.0", default-features = false, features = [
    "wgpu",
    "text",
], optional = true }
# ONE backend per flavor — deliberately NOT vello_gpu's `wgpu_default`, which
# turns on every backend and drags the Vulkan (ash) and GLES (glow) trees into a
# library that can never reach them. `gpu` turns on Metal, `gpu-gles` GLES.
# Depending on wgpu directly with default features off is the customization path
# vello_gpu documents.
wgpu = { version = "=30.0.0", default-features = false, features = [
    "wgsl",
    "std",
], optional = true }
# Engine construction is a one-shot async handshake; nothing per-frame blocks.
pollster = { version = "0.4", optional = true }
# Same version as vello_cpu's own dependency (single copy in the lock); provides
# the filter-effects types push_layer takes, which vello_cpu doesn't re-export.
vello_common = "=0.3.0"
parley = { version = "=0.11", default-features = false, features = ["std"] }
# Bundled fonts only — no `system` feature, so headless server/iOS never touch a
# platform font source. Registration goes through the global collection.
fontique = { version = "=0.11", default-features = false, features = ["std"] }
# Same crate peniko re-exports (single copy in the lock); eval interpolates in
# Oklab/Oklch through it without depending on renderer types.
color = "=0.3.3"
image = { version = "=0.25.10", default-features = false, features = ["gif", "webp", "png", "jpeg"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
# `preserve_order`: an admitted document keeps the author's key order (SCHEMA §10).
serde_json = { version = "1", features = ["preserve_order"] }
# Wraps parse errors with the failing JSON path ("animators[2].keyframes[0].ease")
# — the schema contract promises path-carrying errors.
serde_path_to_error = "0.1"
# The PNG blob is encoded here as RGBA8 (render.rs `encode_png`); same release
# vello_common pulls, so one copy in the lock.
png = "0.18"

# The engine is handed the HOST's MTLDevice + MTLCommandQueue, so wgpu renders
# on the app's device by construction rather than asserting identity after the
# fact. Versions are wgpu-hal 30.0.1's own pins — the raw handoff must speak the
# SAME crate instances wgpu-hal's signatures do, or the types don't unify.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = { version = "0.6.3", optional = true }
objc2-metal = { version = "0.3.2", optional = true }


[patch.crates-io]
# `image` 0.25.10 pulls image-webp 0.2.4, which has two animated-WebP compositing
# bugs: frame GHOSTING on dispose-to-background with a transparent background
# (image-rs/image#2913, image-webp PR #171) and canvas MEMORY CORRUPTION when a
# dispose-to-background precedes an alpha-less lossy frame (PR #178). Both are
# fixed on the unpublished release-0.2.5 branch; pin that exact rev. Swap to the
# crates.io 0.2.5/0.2.6 release once it lands (image-webp issue #183).
image-webp = { git = "https://github.com/image-rs/image-webp", rev = "75f810915d02ae4ff55d3f825bf6a4b07efdf994" }
