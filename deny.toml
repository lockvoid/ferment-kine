# cargo-deny configuration. Enforced in CI: every dependency must be usable under
# our dual MIT/Apache-2.0 license, and advisories are surfaced.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licenses compatible with MIT OR Apache-2.0 distribution.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
